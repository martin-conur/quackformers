[package]
name = "quackformers"
version = "0.1.4"
edition = "2021"
# …

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

[[example]]
name = "quackformers"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb               = { version = "=1.10505.0", features = ["vscalar","vscalar-arrow","vtab-arrow"] }
duckdb-loadable-macros = "0.1.5"
libduckdb-sys        = { version = "=1.10505.0", features = ["loadable-extension"] }
hf-hub               = { version = "0.4.2", default-features = false, features = ["rustls-tls","ureq"] }
once_cell = "1.18"
serde                = "1.0.219"
serde_json           = "1.0.140"
thiserror            = "2.0.12"
tokenizers           = "0.13.2"

# macOS: use Accelerate + Metal
[target.'cfg(target_os = "macos")'.dependencies]
candle-core          = { version = "0.8.4", default-features = false, features = ["accelerate","metal"] }
candle-nn            = { version = "0.8.4", default-features = false, features = ["accelerate","metal"] }
candle-transformers  = { version = "0.8.4", default-features = false, features = ["accelerate","metal"] }
accelerate-src       = "0.3.2"


# Linux on x86_64: Intel MKL.
#
# NOT Windows. intel-mkl-src's mkl-static-lp64-iomp links dynamically against
# Intel OpenMP (libiomp5md.dll) even in its "static" configuration, so the
# extension builds but fails to load:
#   IO Error: ... could not be loaded: The specified module could not be found.
# candle-core pins that feature in its own manifest and Cargo features are
# additive, so it cannot be subtracted here.
#
# intel-mkl-src arrives transitively via candle's `mkl` feature.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
candle-core         = { version = "0.8.4", default-features = false, features = ["mkl"] }
candle-nn           = { version = "0.8.4", default-features = false, features = ["mkl"] }
candle-transformers = { version = "0.8.4", default-features = false, features = ["mkl"] }

# Everything else non-macOS -- Windows (any arch) and linux_arm64, for which
# MKL does not exist. candle's portable `gemm` backend.
[target.'cfg(all(not(target_os = "macos"), not(all(target_os = "linux", target_arch = "x86_64"))))'.dependencies]
candle-core         = { version = "0.8.4", default-features = false }
candle-nn           = { version = "0.8.4", default-features = false }
candle-transformers = { version = "0.8.4", default-features = false }

# OpenSSL for non-Windows
[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl              = { version = "0.10", features = ["vendored"] }
openssl-sys          = { version = "0.9",  features = ["vendored"] }
